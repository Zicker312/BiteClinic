<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
</head>



<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <a href="index.html">
                        <img src="img/логоsvg.svg" alt="TechService Логотип">
                    </a>
                </div>
                <nav class="nav">
                    <ul>
                        <li><a href="index.html">Главная</a></li>
                        <li><a href="services.html">Услуги</a></li>
                        <li><a href="booking.html">Онлайн-запись</a></li>
                        <li class="active"><a href="account.html">Личный кабинет</a></li>
                        <li><a href="news.html">Новости</a></li>
                        <li><a href="contacts.html">Контакты</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main class="main">
        <section class="account-section">
            <div class="container">
                <div class="account-tabs">
                    <div class="tab-buttons">
                        <button class="tab-btn active" data-tab="login">Вход</button>
                        <button class="tab-btn" data-tab="register">Регистрация</button>
                    </div>
                    
                    <div class="tab-content active" id="login">
                        <h1>Вход в личный кабинет</h1>
                        <form action="admin/login.php" method="post" class="account-form" id="loginForm">
                            <div class="form-group">
                                <label for="login-email">Email</label>
                                <input type="email" id="login-email" name="email" required>
                            </div>
                            <div class="form-group">
                                <label for="login-password">Пароль</label>
                                <input type="password" id="login-password" name="password" required>
                            </div>
                            <div class="form-options">
                                <label>
                                    <input type="checkbox" name="remember"> Запомнить меня
                                </label>
                                <a href="#" class="forgot-password">Забыли пароль?</a>
                            </div>
                            <button type="submit" class="btn">Войти</button>
                        </form>
                    </div>
                    
                    <div class="tab-content" id="register">
                        <h1>Регистрация</h1>
                        <form action="admin/regist.php" method="post" class="account-form" id="registerForm">
                            <div class="form-group">
                                <label for="reg-name">Имя</label>
                                <input type="text" id="reg-name" name="name" required>
                            </div>
                            <div class="form-group">
                                <label for="reg-phone">Телефон</label>
                                <input type="tel" id="reg-phone" name="phone" required>
                            </div>
                            <div class="form-group">
                                <label for="reg-email">Email</label>
                                <input type="email" id="reg-email" name="email" required>
                            </div>
                            <div class="form-group">
                                <label for="reg-password">Пароль</label>
                                <input type="password" id="reg-password" name="password" required>
                            </div>
                            <div class="form-group">
                                <label for="reg-confirm">Подтверждение пароля</label>
                                <input type="password" id="reg-confirm" name="confirm" required>
                            </div>
                            <div class="form-group">
                                <label>
                                    <input type="checkbox" name="agreement" required> Я согласен с <a href="#">правилами обработки данных</a>
                                </label>
                            </div>
                            <button type="submit" class="btn">Зарегистрироваться</button>
                        </form>
                    </div>
                    
                    <div class="tab-content" id="profile" style="display: none;">
                        <div class="profile-header">
                            <h1>Личный кабинет</h1>
                            <button class="btn logout-btn">Выйти</button>
                        </div>
                        
                        <div class="profile-info">
                            <div class="user-card">
                                <div class="user-avatar">
                                    <img src="images/user-avatar.jpg" alt="Аватар пользователя">
                                    <button class="change-avatar">Изменить</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">
                    <img src="img/Безымянный-1.svg" alt="TechService Логотип">
                </div>
                <div class="footer-info">
                    <p>г. Москва, ул. Техническая, 15</p>
                    <p>+7 (495) 123-45-67</p>
                    <p>info@techservice.ru</p>
                </div>
                <div class="footer-copy">
                    <p>&copy; 2025 TechService. Все права защищены.</p>
                </div>
            </div>
        </div>
    </footer>
<script>
    document.addEventListener('DOMContentLoaded', () => {
  const tabs = document.querySelectorAll('.tab-btn');
  const loginTab = document.getElementById('login');
  const registerTab = document.getElementById('register');
  const profileTab = document.getElementById('profile');

  // Скрываем профиль сразу
  if (profileTab) {
    profileTab.style.display = 'none';
  }

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      // Снимаем класс active со всех табов
      tabs.forEach(t => t.classList.remove('active'));

      // Делаем активным только тот таб, который нажали
      tab.classList.add('active');

      // Показываем нужный контент, скрываем остальные
      const target = tab.getAttribute('data-tab');
      if (target === 'login') {
        loginTab.style.display = 'block';
        registerTab.style.display = 'none';
      } else if (target === 'register') {
        loginTab.style.display = 'none';
        registerTab.style.display = 'block';
      }

      // Профиль всегда скрыт
      if (profileTab) {
        profileTab.style.display = 'none';
      }
    });
  });
});
</script>
    <script src="account.js"></script>
    
</body>
</html>
